 #Note: debug decisions are located in wbu_miscellaneous_l_english.yml
 #Decisions have at least a name, tooltip, description, and confirmation text.
 #Events habe at least a title, description, and options.

 #Design a Fursona decision
 wbu_design_fursona: "Design a ['$wbu_special_term_fursona$'|U]"
 wbu_design_fursona_tooltip: "Design a $wbu_special_term_fursona$ for your unique identity."
 wbu_design_fursona_desc: "Since the age of [ROOT.Char.GetFaith.PantheonTerm], creating a furred form, a $wbu_special_term_fursona$, to represent onesself has been one of the central traditions. It is now time for me to engage in this holy act and create a $wbu_special_term_fursona$ of my own."
 wbu_design_fursona_confirm: "$wbu_design_fursona$" #this reuses the name key
 wbu_design_fursona_effect_tooltip: "You will have a chance to choose an animal and a color aspect to emphasise your identity and benefit your abilities."
 wbu_design_fursona_age_tooltip: "As a child, your options may be more limited."

 #first event for the "Design Fursona" decision
 wbu_religious_decisions.100.t: "Designing a ['$wbu_special_term_fursona$'|U]"
 wbu_religious_decisions.100.desc: "Designing a $wbu_special_term_fursona$ is a sacred act in the [ROOT.Char.GetFaith.GetAdjective] tradition. [$wbu_special_term_fursona_plural$|U] are supposed to bring comfort to the owner's identity, allowing one to live their life fuller and more authentically. It is an act that should be done with care, expression, and creativity."
 wbu_religious_decisions.100.go: "I pick up my pen and pigments."
 wbu_religious_decisions.100.optout: "$religious_decision.0101.optout$" #this reuses existing localization
 wbu_religious_decisions.100.optout_cooldown_warning_tooltip: "@alert_icon! You will not be able to take this decision again for another five years."

 #second event for the "Design Fursona" decision
 wbu_religious_decisions.101.t: "['$wbu_special_term_fursona$'|U]: Color Aspect"
 wbu_religious_decisions.101.desc: "Although a $wbu_special_term_fursona$ can be created with any colors that one desires, certain pallets are more harmonious and may align with certain identities. There are five main pallets, each said to be aligned with a different element, skill, realm of reality, or biome."
 wbu_religious_decisions.101.earth: "I will use natural tones, from earth and the forest."
 wbu_religious_decisions.101.snow: "I will use pastels and white, like those of gentle morning snow."
 wbu_religious_decisions.101.night: "I will use dark colors, blending into shadows of the night."
 wbu_religious_decisions.101.fire: "I will use ruddy and firely colors, like embers and autumn leaves."
 wbu_religious_decisions.101.sparkle: "I will use saturated and vibrant colors like the “Sparkledogs” of old."

 #third event for the "Design Fursona" decision
 wbu_religious_decisions.102.t: "['$wbu_special_term_fursona$'|U]: Animal Form"
 wbu_religious_decisions.102.desc: "Now that I have chosen a pallet, I now should choose an animal on which to base my $wbu_special_term_fursona$. There are countless animals to choose from, but some of them will better resonate with my chosen identity and values.\n\nFirst, while most [ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip] choose an animal that aligns with their personality, I could choose something that foils, opposes, my personality instead."
 wbu_religious_decisions.102.align: "I will choose an animal that reenforces my personality."
 wbu_religious_decisions.102.align_tooltip: "#italic Options which correspond to each of your personality traits will be presented.#!"
 wbu_religious_decisions.102.oppose: "I will choose an animal that foils my personality."
 wbu_religious_decisions.102.oppose_tooltip: "#italic Options which correspond to the opposite or opposites of each of your personality traits will be presented.#!"

 #fourth event for the "Design Fursona" decision
 #note: I'm making the option localization imbed the modifiers' names for simplicity
 wbu_religious_decisions.103.t: "$wbu_religious_decisions.102.t$"
 wbu_religious_decisions.103.desc_0: "Given that I have chosen to "
 wbu_religious_decisions.103.desc_1a: "emphasize" #multi-part conditional description
 wbu_religious_decisions.103.desc_1b: "oppose"
 wbu_religious_decisions.103.desc_2: "my personality, these animals are the best archetypes for me to choose from. Once this choice is made, my $wbu_special_term_fursona$ will be complete."
